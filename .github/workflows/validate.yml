name: Windows setup static and preview checks
on:
  push:
    branches: [master]
    paths: ['setup-android-mcp.ps1', 'uiautomator2_bridge.py', '.github/workflows/validate.yml']
  pull_request:
    paths: ['setup-android-mcp.ps1', 'uiautomator2_bridge.py', '.github/workflows/validate.yml']
permissions:
  contents: read
jobs:
  safe-preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell syntax and non-mutating default
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'setup-android-mcp.ps1'),[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { throw "PowerShell parse errors: $($errors -join ', ')" }
          $result=& ./setup-android-mcp.ps1
          if (($result -join ' ') -notmatch 'No changes made') { throw 'Default run must be non-mutating' }
      - name: Validate Python bridge syntax
        run: python -m py_compile uiautomator2_bridge.py
